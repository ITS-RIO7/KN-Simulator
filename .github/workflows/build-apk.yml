name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # Pinned: the newest Flutter stable template cannot resolve its Kotlin
      # build dependencies from the plugin portal. 3.47.7 builds cleanly.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate android folder if missing
        run: |
          if [ ! -d "android" ]; then
            TMP="$(mktemp -d)"
            flutter create "$TMP/seed" --platforms=android --project-name kn_simulator
            cp -r "$TMP/seed/android" ./android
            rm -rf "$TMP"
          fi

      # applicationId must match the generated MainActivity package, otherwise
      # Android cannot find the activity and the app crashes on launch.
      - name: Configure Android project
        run: |
          python3 - <<'PY'
          import pathlib, re
          app_id = "com.example.kn_simulator"
          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'(applicationId[ \t]*=?[ \t]*)"[^"]*"', lambda m: m.group(1) + '"' + app_id + '"', t)
              t = re.sub(r'(namespace[ \t]*=?[ \t]*)"[^"]*"', lambda m: m.group(1) + '"' + app_id + '"', t)
              p.write_text(t)
              print("configured", name)
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if m.exists():
              t = m.read_text()
              t = re.sub(r'android:label="[^"]*"', 'android:label="KN Simulator"', t)
              m.write_text(t)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: KN Simulator APK
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: build/app/outputs/flutter-apk/app-release.apk
